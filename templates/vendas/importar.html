{% extends "base.html" %}

{% block title %}Importar Vendas - Menino do Alho{% endblock %}

{% block content %}
<div class="mb-6">
    <h2 class="text-3xl font-bold text-emerald-700 dark:text-emerald-400 mb-2">Importar Vendas</h2>
    <p class="text-gray-600 dark:text-gray-400">Faça upload de um arquivo Excel (.xlsx) ou CSV (.csv)</p>
</div>

{% include 'vendas/_importar_vendas_body.html' %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="{{ url_for('static', filename='js/vendas-importar-form.js') }}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (typeof initImportarVendasForm === 'function') {
        initImportarVendasForm(document, { ajax: false });
    }
});
</script>
{% endblock %}
