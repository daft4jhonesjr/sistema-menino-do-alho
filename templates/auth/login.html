<!DOCTYPE html>
<html lang="pt-BR" class="font-sans antialiased">
<head>
    <script>
        (function() {
            var h = new Date().getHours();
            if (h >= 18 || h < 6) document.documentElement.classList.add('dark');
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Login - Menino do Alho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/auth-session.js') }}"></script>
</head>
<body class="bg-emerald-50 dark:bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="flex justify-center mb-6">
            <img src="{{ url_for('static', filename='images/logo_menino_do_alho_amarelo1.jpeg') }}"
                 alt="Menino do Alho - Gestão de Vendas"
                 class="h-32 md:h-48 w-auto object-contain mx-auto rounded-full mix-blend-multiply">
        </div>
        <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm p-6">
            <h2 class="text-lg font-semibold text-gray-800 dark:text-white mb-4 flex items-center">
                <i data-lucide="log-in" class="w-5 h-5 mr-2 text-emerald-600 dark:text-emerald-400"></i>Entrar
            </h2>
            <form id="form-login" method="POST" action="/login" class="space-y-4" autocomplete="on">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Usuário</label>
                    <input type="text"
                           name="username"
                           id="username"
                           autocomplete="username"
                           autocapitalize="none"
                           autocorrect="off"
                           spellcheck="false"
                           required
                           autofocus
                           class="w-full px-4 py-2.5 border border-gray-200 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm dark:bg-gray-700 dark:text-white dark:placeholder-gray-400"
                           placeholder="Digite seu usuário">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Senha</label>
                    <div class="relative">
                        <input type="password"
                               name="password"
                               id="password"
                               autocomplete="current-password"
                               required
                               placeholder="Digite sua senha"
                               class="w-full border border-gray-300 dark:border-gray-600 rounded-lg p-2.5 focus:ring-emerald-500 focus:border-emerald-500 pr-10 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 dark:text-gray-500 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
                            <svg id="eye_icon_open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                            <svg id="eye_icon_closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center">
                        <input id="remember" name="remember" type="checkbox" checked class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-gray-300 rounded cursor-pointer dark:bg-gray-700 dark:border-gray-600">
                        <label for="remember" class="ml-2 block text-sm text-gray-900 dark:text-gray-300 cursor-pointer">
                            Permanecer conectado
                        </label>
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-700 text-white py-2.5 rounded-xl hover:bg-emerald-600 transition font-medium flex items-center justify-center">
                    <i data-lucide="log-in" class="w-4 h-4 mr-2"></i>Entrar
                </button>
            </form>
            <div id="bloco-faceid" class="hidden mt-4">
                <div class="relative my-3">
                    <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-gray-200 dark:border-gray-600"></div>
                    </div>
                    <div class="relative flex justify-center text-xs">
                        <span class="bg-white dark:bg-gray-800 px-2 text-gray-400 dark:text-gray-500">ou</span>
                    </div>
                </div>
                <button type="button"
                        id="btn-faceid"
                        class="w-full border border-emerald-600 text-emerald-700 dark:text-emerald-400 dark:border-emerald-500 py-2.5 rounded-xl hover:bg-emerald-50 dark:hover:bg-gray-700 transition font-medium flex items-center justify-center">
                    <i data-lucide="scan-face" class="w-4 h-4 mr-2"></i>Entrar com Face ID
                </button>
            </div>
            <p class="mt-4 text-center text-sm text-gray-500 dark:text-gray-400">
                Não tem conta? <a href="{{ url_for('auth.cadastro') }}" class="text-emerald-600 dark:text-emerald-400 hover:text-emerald-700 dark:hover:text-emerald-300 font-medium">Cadastre-se</a>
            </p>
        </div>
    </div>
    <script>if (typeof lucide !== 'undefined') lucide.createIcons();</script>
    <script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const eyeOpen = document.getElementById('eye_icon_open');
        const eyeClosed = document.getElementById('eye_icon_closed');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeOpen.classList.add('hidden');
            eyeClosed.classList.remove('hidden');
        } else {
            passwordInput.type = 'password';
            eyeOpen.classList.remove('hidden');
            eyeClosed.classList.add('hidden');
        }
    }

    function getCsrfToken() {
        var meta = document.querySelector('meta[name="csrf-token"]');
        if (meta) return meta.getAttribute('content') || '';
        var input = document.querySelector('#form-login input[name="csrf_token"]');
        return input ? input.value : '';
    }

    function comTimeout(promise, ms, mensagemErro) {
        return Promise.race([
            promise,
            new Promise(function(_, reject) {
                setTimeout(function() {
                    reject(new Error(mensagemErro || 'Tempo esgotado.'));
                }, ms);
            })
        ]);
    }

    function fetchComTimeout(url, options, timeoutMs) {
        var controller = new AbortController();
        var timer = setTimeout(function() {
            controller.abort();
        }, timeoutMs);
        return fetch(url, Object.assign({}, options, { signal: controller.signal }))
            .finally(function() {
                clearTimeout(timer);
            });
    }

    function obterCoordenadasGPS() {
        var promessaGPS = new Promise(function(resolve) {
            if (!navigator.geolocation) {
                return resolve(null);
            }
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    resolve({
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    });
                },
                function(error) {
                    console.log('GPS negado ou indisponível:', error && error.message);
                    resolve(null);
                },
                { timeout: 2500, enableHighAccuracy: false, maximumAge: 60000 }
            );
        });

        return comTimeout(promessaGPS, 3000, 'GPS timeout')
            .catch(function() {
                return null;
            });
    }

    function mensagemErroLogin(error) {
        if (!error) {
            return 'Não foi possível conectar ao servidor. Verifique sua conexão e tente novamente.';
        }
        if (error.name === 'AbortError') {
            return 'A conexão demorou demais (mais de 15 segundos). Verifique sua internet e tente novamente.';
        }
        var msg = error.message || '';
        if (!msg || msg === 'Failed to fetch' || msg === 'Load failed' || msg === 'NetworkError when attempting to fetch resource.') {
            return 'Não foi possível conectar ao servidor. Verifique sua conexão e tente novamente.';
        }
        return msg;
    }

    var BIOMETRIC_SERVER = 'sistema-menino-do-alho.onrender.com';

    function resetarBotaoLogin(btnSubmit, textoOriginal) {
        if (!btnSubmit) return;
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = textoOriginal;
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function showLoginError(message) {
        if (typeof Swal === 'undefined') {
            alert(message);
            return;
        }
        Swal.fire({
            title: 'Falha no Acesso',
            text: message || 'Não foi possível conectar ao servidor. Deseja tentar novamente?',
            icon: 'error',
            background: '#1e293b',
            color: '#f8fafc',
            confirmButtonColor: '#10b981',
            confirmButtonText: 'Tentar Novamente',
            showCancelButton: false
        }).then(function() {
            var el = document.getElementById('username');
            if (el) el.focus();
        });
    }

    function getNativeBiometric() {
        try {
            var Cap = window.Capacitor;
            if (!Cap || typeof Cap.isNativePlatform !== 'function' || !Cap.isNativePlatform()) {
                return null;
            }
            return (Cap.Plugins && Cap.Plugins.NativeBiometric) || null;
        } catch (e) {
            return null;
        }
    }

    function erroBiometriaCancelado(error) {
        if (!error) return false;
        var code = error.code != null ? Number(error.code) : NaN;
        // 11 App Cancel, 15 System Cancel, 16 User Cancel, 17 User Fallback
        return code === 11 || code === 15 || code === 16 || code === 17;
    }

    async function salvarCredenciaisBiometria(username, password) {
        var NativeBiometric = getNativeBiometric();
        if (!NativeBiometric || !username || !password) return;
        try {
            var disponivel = await NativeBiometric.isAvailable();
            if (!disponivel || !disponivel.isAvailable) return;
            await NativeBiometric.setCredentials({
                username: username,
                password: password,
                server: BIOMETRIC_SERVER
            });
        } catch (e) {
            console.log('Não foi possível salvar credenciais biométricas:', e);
        }
    }

    async function checarBiometriaDisponivel() {
        var NativeBiometric = getNativeBiometric();
        var bloco = document.getElementById('bloco-faceid');
        if (!NativeBiometric || !bloco) return;

        try {
            var result = await NativeBiometric.isAvailable();
            if (!result || !result.isAvailable) return;

            var credenciaisSalvas = false;
            try {
                if (typeof NativeBiometric.isCredentialsSaved === 'function') {
                    var check = await NativeBiometric.isCredentialsSaved({ server: BIOMETRIC_SERVER });
                    credenciaisSalvas = !!(check && check.isSaved);
                } else {
                    await NativeBiometric.getCredentials({ server: BIOMETRIC_SERVER });
                    credenciaisSalvas = true;
                }
            } catch (e) {
                credenciaisSalvas = false;
            }

            if (credenciaisSalvas) {
                bloco.classList.remove('hidden');
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        } catch (e) {
            console.log('Biometria indisponível:', e);
        }
    }

    async function executarLoginComCredenciais(username, password, extras) {
        var formLogin = document.getElementById('form-login');
        var nextInput = formLogin ? formLogin.querySelector('input[name="next"]') : null;
        var rememberInput = formLogin ? formLogin.querySelector('input[name="remember"]') : null;

        var payload = {
            username: username,
            password: password,
            csrf_token: getCsrfToken(),
            next: nextInput ? nextInput.value : '',
            remember: rememberInput ? !!rememberInput.checked : true
        };

        if (extras) {
            Object.keys(extras).forEach(function(k) {
                payload[k] = extras[k];
            });
        }

        var coords = await obterCoordenadasGPS();
        payload.latitude = coords ? coords.latitude : null;
        payload.longitude = coords ? coords.longitude : null;

        var action = (formLogin && formLogin.action) || window.location.href;
        var response = await fetchComTimeout(
            action,
            {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify(payload),
                credentials: 'include'
            },
            15000
        );

        var data = {};
        try {
            data = await response.json();
        } catch (parseErr) {
            data = {};
        }

        if (response.ok && data.success) {
            return data;
        }

        var msg = data.error
            || data.message
            || (response.status === 429
                ? 'Muitas tentativas de login. Aguarde 1 minuto e tente novamente.'
                : 'Credenciais inválidas ou falha de autenticação.');
        throw new Error(msg);
    }

    function redirecionarAposLogin(data) {
        if (window.MeninoAlhoAuth && typeof window.MeninoAlhoAuth.persistirSessao === 'function') {
            window.MeninoAlhoAuth.persistirSessao(data);
        }
        var destino = (window.MeninoAlhoAuth && window.MeninoAlhoAuth.normalizarUrlRedirect)
            ? window.MeninoAlhoAuth.normalizarUrlRedirect(data.redirect_url || '/dashboard')
            : (data.redirect_url || '/dashboard');
        window.location.href = destino;
    }

    async function entrarComFaceId() {
        var NativeBiometric = getNativeBiometric();
        var btnFace = document.getElementById('btn-faceid');
        if (!NativeBiometric) return;

        var textoOriginal = btnFace ? btnFace.innerHTML : '';
        if (btnFace) {
            btnFace.disabled = true;
            btnFace.innerHTML = '<span class="animate-spin inline-block mr-2">🔄</span> Autenticando...';
        }

        try {
            await NativeBiometric.verifyIdentity({
                reason: 'Acesse sua conta no Menino do Alho',
                title: 'Login biométrico',
                subtitle: 'Menino do Alho',
                description: 'Use Face ID ou Touch ID para entrar'
            });

            var credentials = await NativeBiometric.getCredentials({
                server: BIOMETRIC_SERVER
            });

            if (!credentials || !credentials.username || !credentials.password) {
                throw new Error('Nenhuma credencial salva. Entre com usuário e senha uma vez para ativar o Face ID.');
            }

            var data = await executarLoginComCredenciais(credentials.username, credentials.password);
            redirecionarAposLogin(data);
        } catch (error) {
            if (erroBiometriaCancelado(error)) {
                console.log('Face ID cancelado pelo usuário.');
                return;
            }
            console.error('Erro no login biométrico:', error);
            showLoginError(
                mensagemErroLogin(error) ||
                'Não foi possível autenticar com Face ID. Use usuário e senha.'
            );
        } finally {
            if (btnFace) {
                btnFace.disabled = false;
                btnFace.innerHTML = textoOriginal || '<i data-lucide="scan-face" class="w-4 h-4 mr-2"></i>Entrar com Face ID';
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        var formLogin = document.getElementById('form-login');
        if (!formLogin) return;

        var enviando = false;
        checarBiometriaDisponivel();

        var btnFace = document.getElementById('btn-faceid');
        if (btnFace) {
            btnFace.addEventListener('click', function() {
                if (enviando) return;
                entrarComFaceId();
            });
        }

        formLogin.addEventListener('submit', async function(e) {
            e.preventDefault();
            if (enviando) return;

            var btnSubmit = formLogin.querySelector('button[type="submit"]');
            var textoOriginal = btnSubmit ? btnSubmit.innerHTML : 'Entrar';
            var username = (document.getElementById('username') || {}).value || '';
            var password = (document.getElementById('password') || {}).value || '';

            enviando = true;
            if (btnSubmit) {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = '<span class="animate-spin inline-block mr-2">🔄</span> Verificando...';
            }

            try {
                var data = await executarLoginComCredenciais(username, password);
                await salvarCredenciaisBiometria(username, password);
                redirecionarAposLogin(data);
            } catch (error) {
                console.error('Erro no login:', error);
                showLoginError(mensagemErroLogin(error));
            } finally {
                enviando = false;
                resetarBotaoLogin(btnSubmit, textoOriginal);
            }
        });
    });
    </script>
</body>
</html>
